ekf_filter_node:
  ros__parameters:
    frequency: 15.0
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true
    transform_time_offset: 0.05

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Clean Wheel Odometry
    odom0: /odom/clean
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    # Outlier rejection: drops sudden jumps
    odom0_twist_rejection_threshold: 3.0

    # 2. Clean BNO055 IMU
    imu0: /imu/clean
    imu0_config: [false, false, false,
                  false, false, true,    # Yaw orientation
                  false, false, false,
                  false, false, true,    # Yaw rate (angular velocity)
                  false, false, false]
    imu0_queue_size: 10
    # Outlier rejection: drops erratic IMU readings
    imu0_angular_velocity_rejection_threshold: 2.0
    imu0_pose_rejection_threshold: 2.0
    imu0_remove_gravitational_acceleration: true
