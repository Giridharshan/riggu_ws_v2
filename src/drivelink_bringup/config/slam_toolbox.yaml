slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # ROS 2 Frames & Topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # Buffer & Matching Tuning
    transform_timeout: 0.5
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05                # 5cm grid cells
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.1    # Update map after 10cm movement
    minimum_travel_heading: 0.1     # Update map after ~5.7° turn
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
